# Detector for the Azure trace lab. One compressed day is 3600 seconds (1 hour), so the daily
# period is given in seconds and the interval is 5 seconds (720 samples per day).
# The PromQL is the same as in anomaly_detection.lab.signals.
datasource:
  url: http://127.0.0.1:8428

defaults:
  interval: 5s
  backfill: 1h

detectors:
  - name: request_rate
    query: sum(rate(vllm:request_success_total[1m]))
    direction: below
    model: {kind: seasonal, seasonality: [3600]}

  - name: output_tokens
    query: sum(rate(vllm:generation_tokens_total[1m])) / sum(rate(vllm:request_success_total[1m]))
    direction: below
    model: {kind: seasonal, seasonality: [3600]}

  - name: decode_speed
    query: sum(rate(vllm:inter_token_latency_seconds_count[1m])) / sum(rate(vllm:inter_token_latency_seconds_sum[1m]))
    direction: below
    model: {kind: seasonal, seasonality: [3600]}
