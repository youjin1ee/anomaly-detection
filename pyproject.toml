[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Generic anomaly detection sidecar for Prometheus-compatible metric stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    # rrcf (MIT, pure Python) imports pkg_resources at import time, and setuptools
    # 81+ no longer ships it. It also does not declare setuptools as a dependency.
    "rrcf==0.4.4",
    "setuptools<81",
]

[project.scripts]
anomaly-detection = "anomaly_detection.cli:main"
anomaly-detection-eval = "anomaly_detection.harness.cli:main"
anomaly-detection-nab = "anomaly_detection.harness.nab_cli:main"
anomaly-detection-replay = "anomaly_detection.harness.replay_cli:main"
anomaly-detection-boom = "anomaly_detection.harness.boom_cli:main"
anomaly-detection-ensemble = "anomaly_detection.harness.ensemble_cli:main"
anomaly-detection-loadgen = "anomaly_detection.lab.loadgen:main"
anomaly-detection-injector = "anomaly_detection.lab.injector:main"
anomaly-detection-dump = "anomaly_detection.lab.dump:main"

[project.optional-dependencies]
# Forecast-band model on Toto 2.0 (Apache-2.0). Heavy (torch, gluonts); not part of the default
# install. CPU is enough: use the CPU torch wheel index where the default wheel carries CUDA.
toto = [
    "toto-2>=2.0.0",
    "torch>=2.4",
]
# IBM Granite TSPulse (Apache-2.0). granite-tsfm brings transformers, torch, pandas and
# scikit-learn, so it stays out of the core dependencies. CPU-only torch is enough.
tspulse = [
    "granite-tsfm==0.3.12",
]

# Reads the Datadog BOOM arrow files (harness/boom_data.py). The tspulse extra brings it too.
boom = [
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_detection"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning:rrcf -W ignore::DeprecationWarning:pkg_resources"
